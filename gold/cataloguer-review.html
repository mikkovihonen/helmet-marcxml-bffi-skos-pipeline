<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Helmet cataloguer review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #fafaf7;
    --fg: #222;
    --muted: #666;
    --border: #d4d4d0;
    --card-bg: #ffffff;
    --accent: #2b4d8c;
    --keep: #1d6a3b;
    --discard: #a23131;
    --skip: #8a6d00;
    --warn-bg: #fff8e1;
    --warn-border: #d4a83a;
    --warn-fg: #6b4d00;
    --readonly-bg: #f1f1ee;
    --hover: #eaeaea;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 14px;
    line-height: 1.45;
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    box-shadow: var(--shadow);
  }

  /* Sticky wrapper: header + tab strip stay pinned together so the
     cataloguer can switch tabs without scrolling back up. Both children
     keep their natural sizing — the wrapper just owns the sticky
     positioning + z-stacking. */
  .sticky-top {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card-bg);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .reviewer { display: flex; align-items: center; gap: 6px; }
  header .reviewer input {
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font: inherit;
    width: 180px;
  }
  header .stats { margin-left: auto; display: flex; gap: 12px; font-size: 13px; color: var(--muted); }
  header .stats span b { color: var(--fg); }
  header button {
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
  }
  header button:hover { background: var(--hover); }
  header button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  header button.primary:hover { background: #1f3a6e; }

  .tab-strip {
    display: flex;
    gap: 2px;
    padding: 0 20px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab-strip button {
    padding: 8px 14px;
    border: none;
    border-bottom: 2px solid transparent;
    background: transparent;
    cursor: pointer;
    font: inherit;
    color: var(--muted);
    white-space: nowrap;
  }
  .tab-strip button:hover { color: var(--fg); background: var(--hover); }
  .tab-strip button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  .tab-strip button .badge {
    display: inline-block;
    background: var(--readonly-bg);
    padding: 1px 6px;
    border-radius: 8px;
    font-size: 11px;
    margin-left: 6px;
  }
  .tab-strip button.active .badge { background: rgba(43, 77, 140, 0.15); }
  .tab-strip button.unsupported {
    color: #b96b6b;
    font-style: italic;
  }

  main {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 16px;
    padding: 16px 20px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .sidebar {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    height: calc(100vh - 140px);
    overflow-y: auto;
    position: sticky;
    top: 110px;
  }
  .sidebar input.search {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font: inherit;
    margin-bottom: 8px;
  }
  .sidebar ul { list-style: none; margin: 0; padding: 0; }
  .sidebar li {
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 3px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }
  .sidebar li:hover { background: var(--hover); }
  .sidebar li.active { background: var(--accent); color: white; }
  .sidebar li .marker {
    display: inline-block;
    width: 14px;
    text-align: center;
    font-weight: bold;
  }
  .sidebar li .marker.keep { color: var(--keep); }
  .sidebar li .marker.discard { color: var(--discard); }
  .sidebar li .marker.skip { color: var(--skip); }
  .sidebar li.active .marker.keep,
  .sidebar li.active .marker.discard,
  .sidebar li.active .marker.skip { color: white; }
  .sidebar li .bib {
    flex: 1;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Text-style sidebar entry — used by judge (long pair titles) and
     picker (entity literals like "Alessandrini, Rinaldo"). Same flex
     + ellipsis as .bib but in the body font, slightly smaller. */
  .sidebar li .bib.text-entry {
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
  }
  .sidebar li.active .bib { color: white; }
  .sidebar li .badge-cat {
    background: var(--readonly-bg);
    padding: 1px 5px;
    border-radius: 8px;
    font-size: 10px;
    color: var(--muted);
  }
  .sidebar li.active .badge-cat { color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.2); }

  .content { min-width: 0; }

  .empty-state {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 40px 20px;
    text-align: center;
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 6px;
    padding: 32px;
    margin-top: 16px;
    color: var(--muted);
    transition: background 0.2s, border-color 0.2s;
  }
  .dropzone.dragover {
    background: var(--readonly-bg);
    border-color: var(--accent);
    color: var(--accent);
  }
  .empty-state label.file-button {
    display: inline-block;
    margin-top: 12px;
    padding: 8px 16px;
    background: var(--accent);
    color: white;
    border-radius: 4px;
    cursor: pointer;
  }
  .empty-state input[type=file] { display: none; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    margin: 0 0 4px;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card h2 .bib-id {
    font-family: ui-monospace, monospace;
    background: var(--readonly-bg);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
  }
  .card h2 .progress { color: var(--muted); font-weight: normal; font-size: 13px; margin-left: auto; }

  .section { margin-top: 14px; }
  .section .label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .readonly {
    background: var(--readonly-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .existing-agents {
    background: var(--readonly-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
  }
  .existing-agents .agent-chip {
    display: inline-block;
    background: var(--card-bg);
    padding: 2px 8px;
    border-radius: 3px;
    margin: 2px 4px 2px 0;
    font-size: 12px;
    font-family: ui-monospace, monospace;
  }
  .existing-agents .none { color: var(--muted); font-style: italic; font-size: 13px; }

  .marc-view {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0;
    overflow: hidden;
  }
  .marc-view .marc-toolbar {
    background: var(--readonly-bg);
    padding: 4px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .marc-view .marc-toolbar button {
    padding: 2px 8px;
    font-size: 11px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    border-radius: 3px;
    cursor: pointer;
  }
  .marc-view .marc-toolbar button:hover { background: var(--hover); }
  .marc-view table {
    width: 100%;
    border-collapse: collapse;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 12px;
  }
  .marc-view td {
    border-top: 1px solid var(--border);
    padding: 4px 8px;
    vertical-align: top;
  }
  .marc-view td.tag {
    width: 50px;
    color: var(--muted);
    font-weight: 600;
  }
  .marc-view td.ind {
    width: 40px;
    color: var(--muted);
    font-size: 11px;
  }
  .marc-view td.subfields { word-wrap: break-word; word-break: break-word; }
  .marc-view .subfield-code {
    display: inline-block;
    color: var(--accent);
    font-weight: 600;
    margin-right: 2px;
  }
  .marc-view tr.field-245 { background: rgba(43, 77, 140, 0.08); }
  .marc-view tr.field-245 td.tag { color: var(--accent); }
  .marc-view tr.admin-hidden { display: none; }
  .marc-view .marc-missing {
    padding: 16px;
    color: var(--muted);
    font-style: italic;
    text-align: center;
  }
  .marc-view .marc-error {
    padding: 16px;
    color: var(--discard);
  }

  .contrib {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    margin-bottom: 6px;
    background: #fcfcfb;
  }
  .contrib .row {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 6px 10px;
    align-items: center;
    margin-bottom: 4px;
  }
  .contrib .row label { font-size: 12px; color: var(--muted); }
  .contrib input, .contrib select, .contrib textarea {
    width: 100%;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font: inherit;
    background: white;
  }
  .contrib .composite-warn {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-fg);
    padding: 6px 10px;
    border-radius: 3px;
    margin: 6px 0;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .contrib .composite-warn button {
    padding: 3px 10px;
    font-size: 12px;
    background: var(--warn-border);
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
  }
  .contrib .composite-warn button:hover { background: #b89230; }
  .contrib .actions { text-align: right; margin-top: 4px; }
  .contrib .actions button {
    padding: 3px 8px;
    font-size: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    color: var(--discard);
  }
  .contrib .actions button:hover { background: var(--hover); }
  .add-contrib {
    padding: 6px 12px;
    border: 1px dashed var(--border);
    background: var(--card-bg);
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
    color: var(--accent);
    width: 100%;
  }
  .add-contrib:hover { background: var(--hover); }
  .relator-help {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    grid-column: 2;
  }

  .decision-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 8px;
  }
  .decision-row .decision-buttons { display: flex; gap: 4px; }
  .decision-row button.dec {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
    font-weight: 500;
  }
  .decision-row button.dec.keep.active {
    background: var(--keep); color: white; border-color: var(--keep);
  }
  .decision-row button.dec.discard.active {
    background: var(--discard); color: white; border-color: var(--discard);
  }
  .decision-row button.dec.skip.active {
    background: var(--skip); color: white; border-color: var(--skip);
  }

  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  .meta-grid select, .meta-grid textarea {
    width: 100%;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font: inherit;
    background: white;
  }
  .meta-grid textarea {
    grid-column: 1 / -1;
    min-height: 50px;
    font-family: inherit;
    resize: vertical;
  }
  .meta-grid .field { display: flex; flex-direction: column; gap: 3px; }
  .meta-grid .field label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .meta-grid .holdout { flex-direction: row; align-items: center; gap: 6px; }
  .meta-grid .holdout label {
    text-transform: none;
    letter-spacing: 0;
    font-weight: normal;
    color: var(--fg);
    font-size: 13px;
  }

  .toolbar { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
  .toolbar button {
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
  }
  .toolbar button:hover:not([disabled]) { background: var(--hover); }
  .toolbar button[disabled] { opacity: 0.5; cursor: not-allowed; }
  .toolbar .spacer { flex: 1; }
  .keyboard-hint { color: var(--muted); font-size: 12px; }
  .keyboard-hint kbd {
    background: var(--readonly-bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
  }

  .manifest-view {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
  }
  .manifest-view pre {
    background: var(--readonly-bg);
    padding: 10px;
    border-radius: 4px;
    overflow-x: auto;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    margin: 0;
  }
  .manifest-view table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  .manifest-view th, .manifest-view td {
    border-bottom: 1px solid var(--border);
    padding: 6px 8px;
    text-align: left;
    font-size: 13px;
  }
  .manifest-view th { color: var(--muted); font-weight: 600; }

  .unsupported-stage {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 24px;
    color: var(--muted);
    text-align: center;
  }

  /* MARC round-trip tab (P-47) */
  .diff-chip {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    margin-right: 6px;
    background: var(--hover);
    color: var(--fg);
  }
  .diff-chip.identical { background: #e6f4ea; color: #1e7e34; }
  .diff-chip.changed   { background: #fff3cd; color: #856404; }
  .diff-chip.lost      { background: #f8d7da; color: #b21f2d; }
  .diff-chip.added     { background: #d6e9f8; color: #1e5180; }
  .diff-chip.gap       { background: #e9ecef; color: #5a6268; }

  table.marc-diff {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
    font-size: 13px;
  }
  table.marc-diff th, table.marc-diff td {
    border-bottom: 1px solid var(--border);
    padding: 6px 8px;
    text-align: left;
    vertical-align: top;
  }
  table.marc-diff th { color: var(--muted); font-weight: 600; }
  table.marc-diff tr.diff-identical          { background: rgba(46, 125, 50, 0.04); }
  table.marc-diff tr.diff-changed            { background: rgba(245, 166, 35, 0.10); }
  table.marc-diff tr.diff-lost               { background: rgba(220, 53, 69, 0.10); }
  table.marc-diff tr.diff-added              { background: rgba(13, 110, 253, 0.08); }
  table.marc-diff tr.diff-lost-converter-gap { background: rgba(108, 117, 125, 0.08); }
  table.marc-diff tr.diff-notes td           { border-bottom: 1px solid var(--border); }

  /* Judge tab: side-by-side pair layout + LLM banner */
  .pair-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 8px;
  }
  .pair-side {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
  }
  .pair-side h3 {
    margin: 0 0 6px;
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .pair-side .bib-id {
    font-family: ui-monospace, monospace;
    background: var(--readonly-bg);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 12px;
  }
  .pair-side .summary {
    margin-top: 6px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .pair-side .summary div { margin: 2px 0; }
  .pair-side .summary .field-label {
    display: inline-block;
    width: 78px;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .llm-banner {
    background: #eef3fb;
    border: 1px solid #b6c8e3;
    border-radius: 4px;
    padding: 10px 12px;
    margin: 10px 0 6px;
    font-size: 13px;
  }
  .llm-banner.same { background: #e7f5ec; border-color: #8cc9a5; }
  .llm-banner.different { background: #fbeded; border-color: #d99e9e; }
  .llm-banner.uncertain { background: #fff7e0; border-color: #d4a83a; }
  .llm-banner .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 12px;
    background: rgba(0,0,0,0.06);
    margin-right: 6px;
  }
  .llm-banner .confidence {
    font-family: ui-monospace, monospace;
    color: var(--muted);
    font-size: 12px;
  }
  .llm-banner .rationale {
    margin-top: 6px;
    color: var(--fg);
    line-height: 1.4;
  }
  .llm-banner .chips { margin-top: 6px; }
  .llm-banner .chip {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    margin: 2px 4px 2px 0;
    font-size: 11px;
    background: rgba(0,0,0,0.07);
    font-family: ui-monospace, monospace;
  }
  .llm-banner .chip.diverging { background: rgba(162, 49, 49, 0.12); }
  .llm-banner .chip.matching { background: rgba(29, 106, 59, 0.12); }
  .similarity {
    color: var(--muted);
    font-family: ui-monospace, monospace;
    font-size: 12px;
  }
  .decision-row button.dec.agree.active { background: #1d6a3b; color: white; border-color: #1d6a3b; }
  .decision-row button.dec.flip-same.active { background: #2b4d8c; color: white; border-color: #2b4d8c; }
  .decision-row button.dec.flip-different.active { background: #a23131; color: white; border-color: #a23131; }
  .decision-row button.dec.uncertain.active { background: #8a6d00; color: white; border-color: #8a6d00; }

  /* Judge tab: two full pair titles in the card header. Allowed to
     wrap to multiple lines when the titles are long. */
  .card h2.pair-header {
    flex-wrap: wrap;
    align-items: baseline;
  }
  .card h2 .pair-titles {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 10px;
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    min-width: 0;
  }
  .card h2 .pair-titles .pair-title {
    background: var(--readonly-bg);
    padding: 2px 8px;
    border-radius: 4px;
  }
  .card h2 .pair-titles .vs {
    color: var(--muted);
    font-weight: normal;
    font-size: 13px;
  }

  /* Picker tab: entity-centric card header. */
  .card h2 .entity-title {
    font-weight: 600;
    font-size: 16px;
    color: var(--fg);
  }
  .card h2 .entity-chip {
    display: inline-block;
    background: rgba(43, 77, 140, 0.12);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-family: ui-monospace, monospace;
    font-weight: 500;
    margin-left: 6px;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #333;
    color: white;
    padding: 10px 16px;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    z-index: 100;
    transition: opacity 0.3s;
    max-width: 400px;
  }
  .toast.error { background: var(--discard); }
  .toast.fade { opacity: 0; }
</style>
</head>
<body>

<div class="sticky-top">
  <header>
    <h1>Helmet cataloguer review</h1>
    <div class="reviewer">
      <label for="reviewer-name">Your name:</label>
      <input id="reviewer-name" placeholder="e.g. Maija Mäkinen" autocomplete="off">
    </div>
    <div class="stats" id="header-stats" hidden>

// =====================================================================
// State
// =====================================================================

const state = {
  bundleName: null,       // e.g. "review-batch-2026-06-03.zip"
  bundleHash: null,       // SHA-256 of the zip bytes — localStorage key
  files: {},              // {arcname: Uint8Array} from fflate.unzipSync
  manifest: null,         // parsed manifest.json
  stages: [],             // [{stage, surfaceId, candidates, results, currentIdx, filter}]
  activeStageIdx: 0,
};

// Localstorage key for the cross-bundle reviewer-name field.
const LS_REVIEWER = "cataloguer-review-reviewer-name";

// =====================================================================
// localStorage
// =====================================================================

function lsKeyForBundle(hash) { return "cataloguer-review-" + hash; }

function persistState() {
  if (!state.bundleHash) return;
  try {
    const slim = {
      bundleName: state.bundleName,
      stages: state.stages.map(s => ({
        stageId: s.stage.id,
        results: s.results,
        currentIdx: s.currentIdx,
      })),
      activeStageIdx: state.activeStageIdx,
      savedAt: new Date().toISOString(),
    };
    localStorage.setItem(lsKeyForBundle(state.bundleHash), JSON.stringify(slim));
  } catch (e) {
    showToast("Could not save progress: " + e.message, true);
  }
}

function restorePersistedState(hash) {
  try {
    const raw = localStorage.getItem(lsKeyForBundle(hash));
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    console.warn("restorePersistedState parse failed", e);
    return null;
  }
}

// =====================================================================
// Crypto + helpers
// =====================================================================

async function sha256Hex(bytes) {
  const hashBuf = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(hashBuf))
    .map(b => b.toString(16).padStart(2, "0")).join("");
}

function bytesToText(bytes) {
  return new TextDecoder("utf-8").decode(bytes);
}

function textToBytes(text) {
  return new TextEncoder().encode(text);
}

function parseJsonl(text) {
  const rows = [];
  const lines = text.split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i].trim();
    if (!ln) continue;
    try {
      rows.push(JSON.parse(ln));
    } catch (e) {
      throw new Error(`Line ${i + 1}: ${e.message}`);
    }
  }
  return rows;
}

function getReviewerName() {
  return document.getElementById("reviewer-name").value.trim();
}

// =====================================================================
// Bundle load
// =====================================================================

async function handleFile(file) {
  if (!file) return;
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    const hash = await sha256Hex(buf);

    let unzipped;
    try {
      unzipped = fflate.unzipSync(buf);
    } catch (e) {
      showToast("Could not parse zip: " + e.message, true);
      return;
    }
    if (!unzipped["manifest.json"]) {
      showToast("This zip is missing manifest.json — is it a review bundle?", true);
      return;
    }
    let manifest;
    try {
      manifest = JSON.parse(bytesToText(unzipped["manifest.json"]));
    } catch (e) {
      showToast("manifest.json is not valid JSON: " + e.message, true);
      return;
    }
    if (!Array.isArray(manifest.stages)) {
      showToast("manifest.json has no 'stages' array — bundle is malformed.", true);
      return;
    }

    state.bundleName = file.name;
    state.bundleHash = hash;
    state.files = unzipped;
    state.manifest = manifest;
    state.stages = buildStages(manifest, unzipped);
    state.activeStageIdx = 0;

    // Restore prior state.
    const persisted = restorePersistedState(hash);
    if (persisted) {
      const stageById = {};
      for (const ps of persisted.stages || []) stageById[ps.stageId] = ps;
      for (const s of state.stages) {
        const ps = stageById[s.stage.id];
        if (ps) {
          s.results = ps.results || {};
          s.currentIdx = ps.currentIdx || 0;
        }
      }
      if (typeof persisted.activeStageIdx === "number"
          && persisted.activeStageIdx < state.stages.length) {
        state.activeStageIdx = persisted.activeStageIdx;
      }
      const totalRestored = Object.values(persisted.stages || {})
        .reduce((n, ps) => n + Object.keys(ps.results || {}).length, 0);
      if (totalRestored > 0) {
        showToast(`Restored ${totalRestored} prior decision${totalRestored === 1 ? "" : "s"} for this bundle.`);
      }
    }

    document.getElementById("empty").hidden = true;
    document.getElementById("sidebar").hidden = false;
    document.getElementById("header-stats").hidden = false;
    document.getElementById("btn-export").hidden = false;
    document.getElementById("btn-load-new").hidden = false;
    // Show the "Reload bundle" button only when served over HTTP —
    // the auto-fetch path is the only way that button is useful.
    document.getElementById("btn-reload").hidden = !location.protocol.startsWith("http");
    document.getElementById("tab-strip").hidden = false;

    render();
  } catch (e) {
    showToast("Could not load bundle: " + e.message, true);
    console.error(e);
  }
}

function buildStages(manifest, files) {
  const out = [];
  // Manifest tab lands first — acts as a landing card showing what
  // bundle is loaded, before the cataloguer drills into a stage tab.
  // Sidebar stays visible but empty for this tab (no candidate list
  // to scroll).
  out.push({
    stage: { id: "__manifest", label: "Manifest", schema: "__manifest", marc_dir: null },
    surface: null,
    surfaceId: "__manifest",
    candidates: [],
    results: {},
    currentIdx: 0,
    filter: "",
  });
  // P-47: MARC round-trip review tab. Present when the manifest flags
  // ``marc_roundtrip_present`` true (bundle includes the marc-roundtrip
  // directory from the M10 stage). The tab's candidates are the per-bib
  // diff JSONs in marc-roundtrip/diffs/; the renderer is bespoke and
  // doesn't go through STAGE_SURFACES.
  if (manifest.marc_roundtrip_present) {
    const roundtripCandidates = collectMarcRoundtripCandidates(files);
    out.push({
      stage: {
        id: "__marc_roundtrip",
        label: "MARC round-trip",
        schema: "__marc_roundtrip",
        marc_dir: null,
      },
      surface: null,
      surfaceId: "__marc_roundtrip",
      candidates: roundtripCandidates,
      results: {},
      currentIdx: 0,
      filter: "",
    });
  }
  for (const stage of manifest.stages) {
    const surface = STAGE_SURFACES[stage.schema];
    const candidatesBytes = files[stage.candidates];
    let candidates = [];
    if (candidatesBytes) {
      try {
        candidates = parseJsonl(bytesToText(candidatesBytes));
      } catch (e) {
        console.error(`Failed to parse ${stage.candidates}:`, e);
      }
    }
    // Sort the candidate list alphabetically by the same text the
    // sidebar shows for each row — keeps sidebar, keyboard nav, and
    // prev/next button order all in sync. Per-stage sort: picker is
    // by entity label, judge by pair-title, title-lang by title text,
    // contrib + salvage fall back to the bib id (their default
    // sidebar text). Sentinel-undefined values sort last.
    candidates.sort((a, b) => {
      const ka = sidebarSortKey(surface, a);
      const kb = sidebarSortKey(surface, b);
      // Use a locale-aware comparator so Finnish + Swedish characters
      // (ä, ö, å) cluster sensibly with their Latin neighbours.
      return ka.localeCompare(kb, "fi");
    });
    out.push({
      stage,
      surface,
      surfaceId: stage.schema,
      candidates,
      results: {},
      currentIdx: 0,
      filter: "",
    });
  }
  return out;
}

function sidebarSortKey(surface, candidate) {
  // Reuse the surface's sidebar text as the sort key so the visual
  // order matches the text the cataloguer scans by. Passing
  // result=null is safe: every surface's sidebarEntry derives ``text``
  // from candidate fields only (entity_label, title, pair-titles,
  // helmet_bib_id), not from the cataloguer's in-progress decisions.
  const entry = sidebarEntryFor(surface, candidate, null);
  return (entry?.text || "").toLowerCase();
}

function render() {
  renderTabs();
  renderStats();
  const active = state.stages[state.activeStageIdx];
  if (!active) return;
  document.getElementById("sidebar").hidden = false;
  if (active.surfaceId === "__manifest") {
    // Manifest tab: sidebar stays visible but empty (no candidates
    // to list), and the manifest contents render into the details
    // pane (card-host) by renderManifestTab.
    renderSidebar(active);  // active.candidates is []  → empty ul
    renderManifestTab();
    return;
  }
  if (active.surfaceId === "__marc_roundtrip") {
    renderMarcRoundtripSidebar(active);
    renderMarcRoundtripTab(active);
    return;
  }
  renderSidebar(active);
  if (active.surface) {
    renderCard(active);
  } else {
    renderUnsupportedStage(active);
  }
}

function renderTabs() {
  const strip = document.getElementById("tab-strip");
  strip.innerHTML = "";
  for (let i = 0; i < state.stages.length; i++) {
    const s = state.stages[i];
    const btn = document.createElement("button");
    if (s.surfaceId === "__manifest") {
      btn.textContent = "Manifest";
    } else if (s.surfaceId === "__marc_roundtrip") {
      btn.appendChild(document.createTextNode("MARC round-trip"));
      const total = s.candidates.length;
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = `${total}`;
      btn.appendChild(badge);
    } else if (s.surface) {
      btn.appendChild(document.createTextNode(s.surface.label));
      const total = s.candidates.length;
      const done = Object.values(s.results).filter(r => r.decision).length;
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = `${done}/${total}`;
      btn.appendChild(badge);
    } else {
      btn.classList.add("unsupported");
      btn.textContent = `${s.stage.label || s.stage.id} (unsupported)`;
      btn.title = `Schema ${s.stage.schema} is not handled by this reviewer version.`;
    }
    if (i === state.activeStageIdx) btn.classList.add("active");
    btn.addEventListener("click", () => {
      state.activeStageIdx = i;
      persistState();
      render();
    });
    strip.appendChild(btn);
  }
}

function renderStats() {
  document.getElementById("stat-filename").textContent = state.bundleName || "—";
  let total = 0, reviewed = 0;
  for (const s of state.stages) {
    if (s.surfaceId === "__manifest") continue;
    total += s.candidates.length;
    reviewed += Object.values(s.results).filter(r => r.decision).length;
  }
  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-reviewed").textContent = reviewed;
}

function renderSidebar(active) {
  const ul = document.getElementById("candidate-list");
  ul.innerHTML = "";
  const filter = active.filter.toLowerCase();
  const searchInput = document.getElementById("search");
  searchInput.value = active.filter;
  for (let i = 0; i < active.candidates.length; i++) {
    const c = active.candidates[i];
    if (filter) {
      const result0 = active.results[c.id];
      const entry0 = sidebarEntryFor(active.surface, c, result0);
      const hay = (entry0.text + " " + (c.helmet_bib_id || "") + " " + (c.c_subfield || "")).toLowerCase();
      if (!hay.includes(filter)) continue;
    }
    const li = document.createElement("li");
    if (i === active.currentIdx) li.className = "active";
    const result = active.results[c.id];
    const marker = document.createElement("span");
    marker.className = "marker";
    const decConfig = findDecision(active.surface, result?.decision);
    if (decConfig) {
      if (decConfig.markerClass) marker.classList.add(decConfig.markerClass);
      marker.textContent = decConfig.marker || "·";
    } else {
      marker.textContent = "·";
    }

    const entry = sidebarEntryFor(active.surface, c, result);
    const bib = document.createElement("span");
    bib.className = entry.cssClass ? `bib ${entry.cssClass}` : "bib";
    bib.textContent = entry.text;
    if (entry.title) bib.title = entry.title;
    const cat = document.createElement("span");
    cat.className = "badge-cat";
    cat.textContent = entry.badge || "—";

    li.appendChild(marker);
    li.appendChild(bib);
    li.appendChild(cat);
    li.addEventListener("click", () => {
      active.currentIdx = i;
      persistState();
      render();
    });
    ul.appendChild(li);
  }

// =====================================================================
// MARC round-trip tab (P-47)
//
// One sidebar entry per bib in marc-roundtrip/diffs/. The active
// bib's diff JSON drives a side-by-side rendering: original MARC on
// the left, reconstructed MARC on the right, paired field-by-field,
// status-coloured (identical / changed / lost / added / lost-converter-gap).
// =====================================================================

function collectMarcRoundtripCandidates(files) {
  // One candidate per bib JSON. Pre-parse the diff to extract bib_id +
  // counts for the sidebar; the full diff is reloaded on selection
  // (cheap; the parser is the heaviest cost and we already paid it).
  const out = [];
  for (const arcname of Object.keys(files)) {
    if (!arcname.startsWith("marc-roundtrip/diffs/") || !arcname.endsWith(".json")) continue;
    let parsed;
    try {
      parsed = JSON.parse(bytesToText(files[arcname]));
    } catch (e) {
      console.error(`Failed to parse ${arcname}:`, e);
      continue;
    }
    out.push({
      bib_id: parsed.bib_id || arcname.slice("marc-roundtrip/diffs/".length, -".json".length),
      diff: parsed,
      arcname,
    });
  }
  out.sort((a, b) => a.bib_id.localeCompare(b.bib_id, "fi"));
  return out;
}

function renderMarcRoundtripSidebar(active) {
  // Use the same #candidate-list <ul> as the regular renderSidebar so
  // the sidebar styling + search input stay consistent. We also clear
  // the search input since the round-trip tab doesn't filter by it.
  const ul = document.getElementById("candidate-list");
  ul.innerHTML = "";
  const searchInput = document.getElementById("search");
  if (searchInput) {
    searchInput.value = active.filter || "";
    searchInput.placeholder = "Search bib id…";
  }
  const filter = (active.filter || "").toLowerCase();
  for (let i = 0; i < active.candidates.length; i++) {
    const c = active.candidates[i];
    if (filter && !c.bib_id.toLowerCase().includes(filter)) continue;
    const li = document.createElement("li");
    if (i === active.currentIdx) li.className = "active";
    const summary = c.diff?.summary || {};
    const totalDiffs =
      (summary.changed || 0) + (summary.lost || 0) +
      (summary.added || 0) + (summary["lost-converter-gap"] || 0);
    li.innerHTML = `
      <div class="row-main">
        <span class="entry-text">${escapeHtml(c.bib_id)}</span>
        <span class="badge">${totalDiffs}Δ</span>
      </div>
    `;
    li.addEventListener("click", () => {
      active.currentIdx = i;
      persistState();
      render();
    });
    ul.appendChild(li);
  }
}

function renderMarcRoundtripTab(active) {
  const host = document.getElementById("card-host");
  host.innerHTML = "";
  if (!active.candidates.length) {
    host.innerHTML = "<p style='color:var(--muted)'>No round-trip data in this bundle.</p>";
    return;
  }
  const c = active.candidates[active.currentIdx];
  const diff = c.diff;
  // Corpus summary header
  const summaryFile = state.files["marc-roundtrip/summary.json"];
  let corpusSummary = null;
  if (summaryFile) {
    try { corpusSummary = JSON.parse(bytesToText(summaryFile)); } catch (e) { /* shrug */ }
  }
  if (corpusSummary) {
    const header = document.createElement("div");
    header.className = "manifest-view";
    header.style.marginBottom = "16px";
    const ps = corpusSummary.per_status || {};
    header.innerHTML = `
      <h3 style="margin-top:0">MARC round-trip — corpus summary</h3>
      <p style="color:var(--muted); font-size:13px">
        ${corpusSummary.reconstructed} reconstructed · ${corpusSummary.diffed} diffed ·
        ${corpusSummary.missing_original} missing source MARC
      </p>
      <p>
        <span class="diff-chip identical">${ps.identical || 0} identical</span>
        <span class="diff-chip changed">${ps.changed || 0} changed</span>
        <span class="diff-chip lost">${ps.lost || 0} lost</span>
        <span class="diff-chip added">${ps.added || 0} added</span>
        <span class="diff-chip gap">${ps["lost-converter-gap"] || 0} converter gap</span>
      </p>
    `;
    host.appendChild(header);
  }
  // Stub case: original MARC missing
  if (diff.error) {
    const note = document.createElement("p");
    note.style.color = "var(--muted)";
    note.textContent = `Bib ${c.bib_id}: ${diff.error} (${diff.marcxml_path || "no path"})`;
    host.appendChild(note);
    return;
  }
  // Per-bib breakdown
  const bibSummary = diff.summary || {};
  const subhead = document.createElement("h3");
  subhead.textContent = `Bib ${c.bib_id}`;
  host.appendChild(subhead);
  const subline = document.createElement("p");
  subline.style.color = "var(--muted)";
  subline.style.fontSize = "13px";
  subline.innerHTML = `
    <span class="diff-chip identical">${bibSummary.identical || 0} identical</span>
    <span class="diff-chip changed">${bibSummary.changed || 0} changed</span>
    <span class="diff-chip lost">${bibSummary.lost || 0} lost</span>
    <span class="diff-chip added">${bibSummary.added || 0} added</span>
    <span class="diff-chip gap">${bibSummary["lost-converter-gap"] || 0} converter gap</span>
  `;
  host.appendChild(subline);
  // Side-by-side table
  const tbl = document.createElement("table");
  tbl.className = "marc-diff";
  tbl.innerHTML = `
    <thead>
      <tr>
        <th style="width: 80px">Tag</th>
        <th>Original</th>
        <th>Reconstructed (BFFI)</th>
        <th style="width: 90px">Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  `;
  const tbody = tbl.querySelector("tbody");
  for (const f of diff.fields || []) {
    const tr = document.createElement("tr");
    tr.className = "diff-row diff-" + f.status;
    tr.innerHTML = `
      <td><code>${escapeHtml(f.tag)}</code></td>
      <td>${renderMarcField(f.original)}</td>
      <td>${renderMarcField(f.reconstructed)}</td>
      <td><span class="diff-chip ${f.status.replace("lost-converter-gap", "gap")}">${f.status}</span></td>
    `;
    if (f.notes?.length) {
      const noteRow = document.createElement("tr");
      noteRow.className = "diff-notes";
      noteRow.innerHTML = `<td colspan="4" style="color:var(--muted); font-size:12px; padding-left:40px">${f.notes.map(escapeHtml).join(" · ")}</td>`;
      tbody.appendChild(tr);
      tbody.appendChild(noteRow);
    } else {
      tbody.appendChild(tr);
    }
  }
  host.appendChild(tbl);
}

function renderMarcField(field) {
  if (!field) return "<em style='color:var(--muted)'>(absent)</em>";
  if (field.is_control) {
    return `<code style="font-size:12px">${escapeHtml(field.value || "")}</code>`;
  }
  const subs = (field.subfields || [])
    .map(sf => `<span style="margin-right:6px"><code>$${escapeHtml(sf.code)}</code> ${escapeHtml(sf.value)}</span>`)
    .join("");
  const indStr = `${escapeHtml(field.ind1 || " ")}${escapeHtml(field.ind2 || " ")}`;
  return `<code style="color:var(--muted); font-size:11px">[${indStr}]</code> ${subs}`;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// =====================================================================
// MARC viewer
// =====================================================================

function renderMarcView(active, helmetBibId) {
  const container = document.createElement("div");
  container.className = "marc-view";

  const stage = active.stage;
  const marcDir = stage.marc_dir;
  if (!marcDir) {
    const stub = document.createElement("div");
    stub.className = "marc-missing";
    stub.textContent = "This stage doesn't carry MARC sidecars.";
    container.appendChild(stub);
    return container;
  }
  const arcname = marcDir + helmetBibId + ".xml";
  const bytes = state.files[arcname];
  if (!bytes) {
    const stub = document.createElement("div");
    stub.className = "marc-missing";
    stub.textContent = `No MARCXML available for bib ${helmetBibId}.`;
    container.appendChild(stub);
    return container;
  }

  let xmlDoc;
  try {
    xmlDoc = new DOMParser().parseFromString(bytesToText(bytes), "application/xml");
  } catch (e) {
    const err = document.createElement("div");
    err.className = "marc-error";
    err.textContent = "Could not parse MARCXML: " + e.message;
    container.appendChild(err);
    return container;
  }
  const parserError = xmlDoc.querySelector("parsererror");
  if (parserError) {
    const err = document.createElement("div");
    err.className = "marc-error";
    err.textContent = "Malformed MARCXML — DOMParser reported an error.";
    container.appendChild(err);
    return container;
  }

  // Some MARCXML files have a namespace; querySelectorAll with the
  // bare tag name works in most browsers, but be safe with getElementsByTagNameNS.
  const ns = "http://www.loc.gov/MARC21/slim";
  function getNamespaced(parent, local) {
    return Array.from(parent.getElementsByTagNameNS(ns, local));
  }
  function getAny(parent, local) {
    // Try namespaced first; fall back to bare-tag for files lacking xmlns.
    const a = getNamespaced(parent, local);
    return a.length ? a : Array.from(parent.getElementsByTagName(local));
  }

  // Toolbar (show/hide admin fields).
  const toolbar = document.createElement("div");
  toolbar.className = "marc-toolbar";
  const title = document.createElement("span");
  title.textContent = `MARC record for ${helmetBibId}`;
  toolbar.appendChild(title);
  const spacer = document.createElement("span");
  spacer.style.flex = "1";
  toolbar.appendChild(spacer);
  const toggleBtn = document.createElement("button");
  toggleBtn.type = "button";
  toggleBtn.textContent = "Show admin fields";
  toggleBtn.addEventListener("click", () => {
    const showing = container.classList.toggle("show-admin");
    toggleBtn.textContent = showing ? "Hide admin fields" : "Show admin fields";
    container.querySelectorAll("tr.admin-hidden").forEach(tr => {
      tr.style.display = showing ? "" : "none";
    });
  });
  toolbar.appendChild(toggleBtn);
  container.appendChild(toolbar);

  const table = document.createElement("table");
  const tbody = document.createElement("tbody");
  table.appendChild(tbody);

  // Leader.
  const leaderEl = getAny(xmlDoc, "leader")[0];
  if (leaderEl && leaderEl.textContent) {
    const tr = document.createElement("tr");
    tr.classList.add("admin-hidden");
    tr.style.display = "none";
    const td1 = document.createElement("td");
    td1.className = "tag";
    td1.textContent = "LDR";
    const td2 = document.createElement("td");
    td2.className = "ind";
    const td3 = document.createElement("td");
    td3.className = "subfields";
    td3.textContent = leaderEl.textContent;
    tr.append(td1, td2, td3);
    tbody.appendChild(tr);
  }

  // Control fields.
  for (const cf of getAny(xmlDoc, "controlfield")) {
    const tag = cf.getAttribute("tag") || "";
    const tr = document.createElement("tr");
    if (ADMIN_FIELDS.has(tag)) {
      tr.classList.add("admin-hidden");
      tr.style.display = "none";
    }
    const td1 = document.createElement("td");
    td1.className = "tag";
    td1.textContent = tag;
    const td2 = document.createElement("td");
    td2.className = "ind";
    const td3 = document.createElement("td");
    td3.className = "subfields";
    td3.textContent = cf.textContent || "";
    tr.append(td1, td2, td3);
    tbody.appendChild(tr);
  }

  // Data fields.
  for (const df of getAny(xmlDoc, "datafield")) {
    const tag = df.getAttribute("tag") || "";
    const ind1 = df.getAttribute("ind1") || " ";
    const ind2 = df.getAttribute("ind2") || " ";
    const tr = document.createElement("tr");
    if (tag === "245") tr.classList.add("field-245");
    const td1 = document.createElement("td");
    td1.className = "tag";
    td1.textContent = tag;
    const td2 = document.createElement("td");
    td2.className = "ind";
    td2.textContent = `${ind1}${ind2}`.replace(/ /g, "_");
    const td3 = document.createElement("td");
    td3.className = "subfields";
    for (const sf of getAny(df, "subfield")) {
      const code = sf.getAttribute("code") || "";
      const codeEl = document.createElement("span");
      codeEl.className = "subfield-code";
      codeEl.textContent = `$${code}`;
      td3.appendChild(codeEl);
      td3.appendChild(document.createTextNode((sf.textContent || "") + " "));
    }
    tr.append(td1, td2, td3);
    tbody.appendChild(tr);
  }

  container.appendChild(table);
  return container;
}

// =====================================================================
// Decision row + per-card chrome (stage-agnostic)
// =====================================================================

// Default decision config used when a surface doesn't define its own
// (i.e. contrib). Each entry: { id, label, marker (sidebar glyph),
// markerClass (CSS), key (keyboard shortcut), onChoose? (side-effect
// applied to result before stampReview).
const DEFAULT_DECISION_CONFIG = [
  { id: DECISIONS.KEEP, label: "KEEP", marker: "K", markerClass: "keep", key: "k" },
  { id: DECISIONS.DISCARD, label: "DISCARD", marker: "D", markerClass: "discard", key: "d" },
  { id: DECISIONS.SKIP, label: "SKIP-FOR-NOW", marker: "S", markerClass: "skip", key: "s" },
];

function getDecisionConfig(surface) {
  return surface && surface.decisionConfig ? surface.decisionConfig : DEFAULT_DECISION_CONFIG;
}

// Sidebar entry + card header are surface-aware so non-bib-centric
// surfaces (picker — vocabulary entries) can override the chrome
// without forking the generic renderSidebar/renderCard pipeline.

function sidebarEntryFor(surface, candidate, result) {
  if (surface && typeof surface.sidebarEntry === "function") {
    return surface.sidebarEntry(candidate, result);
  }
  return {
    text: candidate.helmet_bib_id || "—",
    badge: (result && result.category) || candidate.category || "—",
    title: null,
  };
}

function renderCardHeader(active, candidate) {
  const surface = active.surface;
  if (surface && typeof surface.renderCardHeader === "function") {
    const h2 = surface.renderCardHeader(candidate, {
      progressText: `${active.currentIdx + 1} / ${active.candidates.length}`,
    });
    if (h2) return h2;
  }
  // Default: "Bib <id>" + progress counter (contrib + judge).
  const h2 = document.createElement("h2");
  const bibSpan = document.createElement("span");
  bibSpan.className = "bib-id";
  bibSpan.textContent = candidate.helmet_bib_id || "—";
  h2.appendChild(document.createTextNode("Bib "));
  h2.appendChild(bibSpan);
  const progress = document.createElement("span");
  progress.className = "progress";
  progress.textContent = `${active.currentIdx + 1} / ${active.candidates.length}`;
  h2.appendChild(progress);
  return h2;
}

function findDecision(surface, decisionId) {
  if (!decisionId) return null;
  return getDecisionConfig(surface).find(d => d.id === decisionId) || null;
}

function renderDecisionRow(active, result) {
  const row = document.createElement("div");
  row.className = "decision-row";
  const buttons = document.createElement("div");
  buttons.className = "decision-buttons";
  for (const dec of getDecisionConfig(active.surface)) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "dec " + (dec.markerClass || "");
    btn.textContent = dec.label;
    if (result.decision === dec.id) btn.classList.add("active");
    btn.addEventListener("click", () => {
      result.decision = dec.id;
      if (typeof dec.onChoose === "function") dec.onChoose(result);
      stampReview(result);
      persistState();
      render();
      autoAdvance(active);
    });
    buttons.appendChild(btn);
  }
  row.appendChild(buttons);
  return row;
}

function renderToolbar(active) {
  const toolbar = document.createElement("div");
  toolbar.className = "toolbar";
  const prevBtn = document.createElement("button");
  prevBtn.textContent = "← Previous";
  prevBtn.disabled = active.currentIdx === 0;
  prevBtn.addEventListener("click", () => {
    active.currentIdx--; persistState(); render();
  });
  const nextBtn = document.createElement("button");
  nextBtn.textContent = "Next →";
  nextBtn.disabled = active.currentIdx === active.candidates.length - 1;
  nextBtn.addEventListener("click", () => {
    active.currentIdx++; persistState(); render();
  });
  toolbar.appendChild(prevBtn);
  toolbar.appendChild(nextBtn);
  const spacer = document.createElement("div");
  spacer.className = "spacer";
  toolbar.appendChild(spacer);
  const hint = document.createElement("div");
  hint.className = "keyboard-hint";
  hint.innerHTML = '<kbd>K</kbd> keep · <kbd>D</kbd> discard · <kbd>S</kbd> skip · <kbd>←</kbd>/<kbd>→</kbd> navigate';
  toolbar.appendChild(hint);
  return toolbar;
}

function renderCard(active) {
  const host = document.getElementById("card-host");
  host.innerHTML = "";
  if (!active.candidates.length) {
    const div = document.createElement("div");
    div.className = "empty-state";
    div.innerHTML = `<h3>No candidates in this stage</h3>`;
    host.appendChild(div);
    return;
  }
  const c = active.candidates[active.currentIdx];
  if (!c) return;
  const result = ensureResult(active, c);

  const card = document.createElement("div");
  card.className = "card";

  // Header — surface-aware. Default = "Bib <id>"; picker overrides
  // to an entity-centric title since picker rows reference vocabulary
  // entries, not bibliographic records.
  const h2 = renderCardHeader(active, c);
  card.appendChild(h2);

  // Delegate the per-stage body to the surface.
  const body = active.surface.renderCard(c, result, {
    sectionEl: makeSection,
    readonlyEl: makeReadonly,
    marcView: () => renderMarcView(active, c.helmet_bib_id),
    marcViewFor: bibId => renderMarcView(active, bibId),
    rerender: () => render(),
    persist: () => persistState(),
  });
  card.appendChild(body);

  // Decision row.
  const decisionSection = makeSection("Decision", renderDecisionRow(active, result));
  card.appendChild(decisionSection);

  // Meta row (category / holdout / notes — stage-agnostic across
  // contrib-like surfaces but driven by the surface's chrome hooks).
  if (active.surface.renderMeta) {
    card.appendChild(active.surface.renderMeta(c, result, {
      rerender: () => render(),
      persist: () => persistState(),
    }));
  }

  // Generic MARC section — sits between decision controls + meta
  // (above) and the prev/next toolbar (below). Surfaces opt in by
  // implementing ``getMarcBibId(candidate)`` returning the originating
  // bib id (or null when there's none to show). Surfaces that render
  // MARC inline (judge — both A + B side-by-side) leave the hook
  // unimplemented; the section just isn't added.
  if (typeof active.surface.getMarcBibId === "function") {
    const bibId = active.surface.getMarcBibId(c);
    if (bibId) {
      card.appendChild(makeSection("MARC record", renderMarcView(active, bibId)));
    }
  }

  card.appendChild(renderToolbar(active));
  host.appendChild(card);
}

function makeSection(label, body) {
  const div = document.createElement("div");
  div.className = "section";
  const l = document.createElement("div");
  l.className = "label";
  l.textContent = label;
  div.appendChild(l);
  div.appendChild(body);
  return div;
}

function makeReadonly(text) {
  const d = document.createElement("div");
  d.className = "readonly";
  d.textContent = text;
  return d;
}

function ensureResult(active, c) {
  if (active.results[c.id]) return active.results[c.id];
  const seeded = active.surface.seedResult(c);
  active.results[c.id] = seeded;
  return seeded;
}

function stampReview(result) {
  result.reviewed_by = getReviewerName();
  result.reviewed_at = new Date().toISOString();
}

function autoAdvance(active) {
  if (active.currentIdx < active.candidates.length - 1) {
    setTimeout(() => { active.currentIdx++; persistState(); render(); }, 150);
  }
}

// ---- Contrib surface ------------------------------------------------

function contribSeedResult(c) {
  const seedContribs = (c.expected_contributions || []).map(x => ({
    name: x.name || "",
    relator_code: x.relator_code || "aut",
    transliteration_of: x.transliteration_of || null,
    role_text: x.role_text || null,
  }));
  return {
    id: c.id,
    helmet_bib_id: c.helmet_bib_id,
    c_subfield: c.c_subfield,
    existing_agents: c.existing_agents || [],
    decision: null,
    category: CATEGORIES.includes(c.category) ? c.category : CATEGORIES[0],
    holdout: !!c.holdout,
    vetted_contributions: seedContribs,
    notes: "",
    reviewed_by: getReviewerName(),
    reviewed_at: null,
  };
}

function contribRenderBody(c, result, helpers) {
  const frag = document.createDocumentFragment();

  // MARC view is rendered generically by renderCard below the decision
  // row + meta (see ``getMarcBibId`` on this surface).

  // 245$c.
  frag.appendChild(helpers.sectionEl(
    "MARC 245$c (statement of responsibility)",
    helpers.readonlyEl(c.c_subfield || "(empty)")
  ));

  // Existing agents.
  const agents = c.existing_agents || [];
  const agentsEl = document.createElement("div");
  agentsEl.className = "existing-agents";
  if (!agents.length) {
    agentsEl.innerHTML = '<span class="none">No 100/700 agents on this record.</span>';
  } else {
    for (const a of agents) {
      const chip = document.createElement("span");
      chip.className = "agent-chip";
      chip.textContent = a;
      agentsEl.appendChild(chip);
    }
  }
  frag.appendChild(helpers.sectionEl("Existing agents (100/700)", agentsEl));

  // Vetted contributions (editable).
  const contribSection = document.createElement("div");
  contribSection.className = "section";
  const lbl = document.createElement("div");
  lbl.className = "label";
  lbl.textContent = "Vetted contributions (your edits land here)";
  contribSection.appendChild(lbl);
  const contribConfig = {
    agentsKey: "vetted_contributions",
    existingAgents: agents,
    showTransliterationOf: true,
    showCompositeWarn: true,
    showVerbatimCheck: false,
    verbatimSource: null,
  };
  for (let i = 0; i < result.vetted_contributions.length; i++) {
    contribSection.appendChild(renderAgentEditor(result, i, helpers, contribConfig));
  }
  const addBtn = document.createElement("button");
  addBtn.className = "add-contrib";
  addBtn.type = "button";
  addBtn.textContent = "+ Add agent";
  addBtn.addEventListener("click", () => {
    result.vetted_contributions.push({
      name: "", relator_code: "aut", transliteration_of: null, role_text: null,
    });
    helpers.persist();
    helpers.rerender();
  });
  contribSection.appendChild(addBtn);
  frag.appendChild(contribSection);

  return frag;
}

// Generic agent editor shared by contrib (M3) + salvage (M2). The
// caller supplies a ``config`` object: which array on ``result``
// holds the agents, whether to show the transliteration_of dropdown,
// the verbatim-substring source text (M2 only), etc.
function renderAgentEditor(result, idx, helpers, config) {
  const agents = result[config.agentsKey];
  const agent = agents[idx];
  const wrap = document.createElement("div");
  wrap.className = "contrib";

  function makeRow(label, inputEl, help) {
    const row = document.createElement("div");
    row.className = "row";
    const lbl = document.createElement("label");
    lbl.textContent = label;
    row.appendChild(lbl);
    row.appendChild(inputEl);
    if (help) {
      const h = document.createElement("div");
      h.className = "relator-help";
      h.textContent = help;
      row.appendChild(h);
    }
    return row;
  }

  // --- Name (with optional verbatim-substring sanity check).
  const nameIn = document.createElement("input");
  nameIn.value = agent.name || "";
  nameIn.placeholder = config.namePlaceholder || "e.g. Carol Cuellar";

  function refreshVerbatimWarn() {
    if (!config.showVerbatimCheck) return;
    const src = (config.verbatimSource || "").toLowerCase();
    if (agent.name && !src.includes(agent.name.toLowerCase())) {
      nameIn.style.borderColor = "var(--warn-border)";
      nameIn.title =
        "This name doesn't appear verbatim in MARC 245$c. P-41's hallucination " +
        "defence requires verbatim substrings; departing from that is legitimate " +
        "for typo-fixes but flag in notes.";
    } else {
      nameIn.style.borderColor = "";
      nameIn.title = "";
    }
  }
  refreshVerbatimWarn();

  nameIn.addEventListener("input", () => {
    agent.name = nameIn.value;
    stampReview(result);
    helpers.persist();
    refreshCompositeWarn();
    refreshVerbatimWarn();
  });
  const nameHelp = config.showVerbatimCheck
    ? "Should appear verbatim in 245$c above (P-41's hallucination defence)."
    : undefined;
  wrap.appendChild(makeRow("Name", nameIn, nameHelp));

  // --- Composite-name warning + split button.
  const warnRow = document.createElement("div");
  warnRow.style.display = "none";
  warnRow.className = "composite-warn";
  if (config.showCompositeWarn) wrap.appendChild(warnRow);

  function refreshCompositeWarn() {
    if (!config.showCompositeWarn) return;
    const m = (agent.name || "").match(COMPOSITE_RX);
    if (!m) { warnRow.style.display = "none"; warnRow.innerHTML = ""; return; }
    warnRow.style.display = "";
    warnRow.innerHTML = "";
    const txt = document.createElement("span");
    txt.textContent = `This name looks composite (matched "${m[0].trim()}"). Split into separate agents?`;
    warnRow.appendChild(txt);
    const splitBtn = document.createElement("button");
    splitBtn.type = "button";
    splitBtn.textContent = "Split on separator";
    splitBtn.addEventListener("click", () => {
      const pieces = splitCompositeName(agent.name);
      if (pieces.length < 2) {
        showToast("Couldn't find a clean way to split this name.", true);
        return;
      }
      if (!confirm(`Split into ${pieces.length} agents:\n - ${pieces.join("\n - ")}\n\nProceed?`)) return;
      // Replace this agent with N agents sharing the original's role
      // + (when present) the transliteration pointer.
      const replacement = pieces.map(p => {
        const next = { name: p, relator_code: agent.relator_code, role_text: null };
        if (config.showTransliterationOf) {
          next.transliteration_of = agent.transliteration_of || null;
        }
        return next;
      });
      result[config.agentsKey].splice(idx, 1, ...replacement);
      stampReview(result);
      helpers.persist();
      helpers.rerender();
    });
    warnRow.appendChild(splitBtn);
  }
  refreshCompositeWarn();

  // --- Role: dropdown + raw text input (raw accepts pipe-separated combos).
  const roleSel = document.createElement("select");
  for (const r of RELATOR_CODES) {
    const opt = document.createElement("option");
    opt.value = r.code;
    opt.textContent = `${r.code} — ${r.label}`;
    roleSel.appendChild(opt);
  }
  const currentRelator = agent.relator_code || "aut";
  const firstPiece = currentRelator.split("|")[0];
  roleSel.value = RELATOR_CODES.find(r => r.code === firstPiece) ? firstPiece : "aut";

  const rawRoleIn = document.createElement("input");
  rawRoleIn.type = "text";
  rawRoleIn.value = currentRelator;
  rawRoleIn.style.fontFamily = "ui-monospace, monospace";
  rawRoleIn.title = "Raw relator code (allows pipe-separated, e.g. aft|aui|ctb)";
  rawRoleIn.addEventListener("input", () => {
    agent.relator_code = rawRoleIn.value;
    stampReview(result);
    helpers.persist();
  });
  roleSel.addEventListener("change", () => {
    agent.relator_code = roleSel.value;
    rawRoleIn.value = roleSel.value;
    stampReview(result);
    helpers.persist();
  });
  const roleWrap = document.createElement("div");
  roleWrap.style.display = "grid";
  roleWrap.style.gridTemplateColumns = "1fr 110px";
  roleWrap.style.gap = "6px";
  roleWrap.appendChild(roleSel);
  roleWrap.appendChild(rawRoleIn);
  wrap.appendChild(makeRow("Role", roleWrap,
    "Pick from the dropdown — or type a pipe-separated combo like 'aft|aui|ctb' for genuinely ambiguous roles."));

  // --- transliteration_of selector (contrib only; M2 has no
  // pre-existing agents to point variants at).
  if (config.showTransliterationOf) {
    const existingAgents = config.existingAgents || [];
    const trlSel = document.createElement("select");
    const noneOpt = document.createElement("option");
    noneOpt.value = ""; noneOpt.textContent = "— none (genuinely new agent) —";
    trlSel.appendChild(noneOpt);
    for (const a of existingAgents) {
      const opt = document.createElement("option");
      opt.value = a; opt.textContent = a;
      trlSel.appendChild(opt);
    }
    if (agent.transliteration_of && !existingAgents.includes(agent.transliteration_of)) {
      const opt = document.createElement("option");
      opt.value = agent.transliteration_of;
      opt.textContent = agent.transliteration_of + " (not in 100/700)";
      trlSel.appendChild(opt);
    }
    trlSel.value = agent.transliteration_of || "";
    trlSel.addEventListener("change", () => {
      agent.transliteration_of = trlSel.value || null;
      stampReview(result);
      helpers.persist();
    });
    wrap.appendChild(makeRow("Variant of", trlSel,
      "If this is a spelling variant or transliteration of an existing 100/700 agent, point to it here."));
  }

  // --- Remove this agent.
  const actions = document.createElement("div");
  actions.className = "actions";
  const rm = document.createElement("button");
  rm.type = "button";
  rm.textContent = "✕ Remove this agent";
  rm.addEventListener("click", () => {
    result[config.agentsKey].splice(idx, 1);
    stampReview(result);
    helpers.persist();
    helpers.rerender();
  });
  actions.appendChild(rm);
  wrap.appendChild(actions);

  return wrap;
}

function splitCompositeName(name) {
  // Strip ".. et al." / "et al." suffix first; the remaining
  // substring is what we split on language connectors.
  let s = (name || "").replace(/\.{1,2}\s*et\s+al\.?$/i, "").replace(/\s+et\s+al\.?$/i, "");
  s = s.trim();
  const parts = s.split(/\s+(?:ja|och|und|et|and|&)\s+/i)
    .map(p => p.replace(/^[\s,;]+|[\s,;]+$/g, "").trim())
    .filter(p => p.length);
  // Dedup (occasional repeat tokens after stripping).
  return Array.from(new Set(parts));
}

function renderPairSide(label, record, helpers) {
  const side = document.createElement("div");
  side.className = "pair-side";

  const h3 = document.createElement("h3");
  h3.appendChild(document.createTextNode(label + " "));
  const bib = document.createElement("span");
  bib.className = "bib-id";
  bib.textContent = record?.helmet_bib_id || "(no bib id)";
  h3.appendChild(bib);
  side.appendChild(h3);

  // Summary table (creator/title/language/year/content_type).
  const summary = document.createElement("div");
  summary.className = "summary";
  const fields = ["creator", "title", "uniform_title", "language", "year", "content_type"];
  let printed = 0;
  for (const f of fields) {
    const v = record?.[f];
    if (v == null || v === "") continue;
    const row = document.createElement("div");
    const lbl = document.createElement("span");
    lbl.className = "field-label";
    lbl.textContent = f;
    row.appendChild(lbl);
    row.appendChild(document.createTextNode(v));
    summary.appendChild(row);
    printed++;
  }
  if (!printed) {
    const stub = document.createElement("div");
    stub.style.color = "var(--muted)";
    stub.style.fontStyle = "italic";
    stub.textContent = "No record context available.";
    summary.appendChild(stub);
  }
  side.appendChild(summary);

  // MARC view for this side (looked up by bib id).
  if (record?.helmet_bib_id) {
    side.appendChild(helpers.marcViewFor(record.helmet_bib_id));
  }
  return side;
}

// ---- Picker surface --------------------------------------------------

// Short sidebar badge for a judge pair — full decision strings are
// long ("different_work"); the cataloguer just needs to scan which
// class it falls into.
function judgeBadgeText(llmDecision) {
  if (llmDecision === "same_work") return "same";
  if (llmDecision === "different_work") return "diff";
  if (llmDecision === "uncertain") return "?";
  return "—";
}

function inferPickerVocab(c) {
  // Source vocab of whichever URI the outcome actually bound — that's
  // the URI the cataloguer is reviewing. Falls back to the LLM's pick
  // when the outcome's vocab can't be derived, then to "uncertain".
  const targetUri = c.outcome_chosen_uri || c.llm_chosen_uri;
  if (targetUri && Array.isArray(c.candidates)) {
    for (const cand of c.candidates) {
      if (cand.uri === targetUri && cand.source_vocabulary) {
        return cand.source_vocabulary;
      }
    }
  }
  return c.outcome_stage === "watchdog_aborted" ? "timeout" : "uncertain";
}

  // Originating record (MARC view) is rendered generically by

    "<th style='text-align:left; padding:4px 8px'>vocab</th>" +
    "<th style='text-align:right; padding:4px 8px'>lexical</th>" +
    "<th style='text-align:left; padding:4px 8px'>URI</th>" +
    "</tr></thead>";

  for (const cand of c.candidates || []) {
    const tr = document.createElement("tr");

    if (isLLM) tr.style.background = "rgba(43, 77, 140, 0.08)";

    const tdPick = document.createElement("td");

    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "picker-cand-" + c.id;
    radio.value = cand.uri;
    radio.checked = isPicked;
    radio.disabled = result.decision !== PICKER_DECISIONS.PICK_CANDIDATE;
    radio.addEventListener("change", () => {
      if (radio.checked) {
        result.expected_uri = cand.uri;
        stampReview(result);
        helpers.persist();
        helpers.rerender();
      }
    });
    tdPick.appendChild(radio);
    if (isLLM) {

      star.style.marginLeft = "4px";

    const tdLabel = document.createElement("td");

      cand.lexical_similarity != null ? Number(cand.lexical_similarity).toFixed(3) : "—";
    tr.appendChild(tdLex);

    const tdUri = document.createElement("td");
    tdUri.style.padding = "4px 8px";
    tdUri.style.fontFamily = "ui-monospace, monospace";
    tdUri.style.fontSize = "11px";

    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = cand.uri;
    tdUri.appendChild(link);
    tr.appendChild(tdUri);

    candTbody.appendChild(tr);
  }
  candTable.appendChild(candTbody);
  candSection.appendChild(candTable);

  if (result.decision === PICKER_DECISIONS.PICK_CANDIDATE && !result.expected_uri) {
    const hint = document.createElement("div");

    hint.style.color = "var(--warn-fg)";

      "If none of these is right, use NO-MATCH instead.";
    candSection.appendChild(hint);
  }
  frag.appendChild(candSection);

  return frag;
}

function renderTitleLangSegmentRow(c, result, idx, helpers) {
  const seg = result.expected_segments[idx];
  const llmSeg = (c.llm_segments && c.llm_segments[idx]) || {};
  const wrap = document.createElement("div");
  wrap.className = "agent-row";

  // Segment text (read-only). The cataloguer can't re-split the title

  textEl.style.borderRadius = "4px";
  textEl.style.fontFamily = "ui-monospace, monospace";
  textEl.textContent = seg.text;
  wrap.appendChild(textEl);

  // Language dropdown: candidates + a "—" option for null.
  const langSelect = document.createElement("select");
  langSelect.className = "role-select";
  const noneOpt = document.createElement("option");
  noneOpt.value = "__none__";
  noneOpt.textContent = "— (no tag)";
  langSelect.appendChild(noneOpt);
  for (const lang of (c.candidates || [])) {
    const opt = document.createElement("option");
    opt.value = lang;
    opt.textContent = lang;
    langSelect.appendChild(opt);
  }
  langSelect.value = seg.lang || "__none__";
  langSelect.addEventListener("change", () => {
    seg.lang = langSelect.value === "__none__" ? null : langSelect.value;
    stampReview(result);
    helpers.persist();
    helpers.rerender();
  });
  wrap.appendChild(langSelect);

  // Flip indicator: highlight when the cataloguer's pick differs from
  // the LLM's. Quiet signal — same diff colour as M6 judge banners.
  if ((llmSeg.lang || null) !== (seg.lang || null)) {
    const flag = document.createElement("span");
    flag.className = "agent-chip";
    flag.style.background = "rgba(217, 158, 158, 0.25)";
    flag.style.color = "#7a2424";
    flag.textContent = `flipped (was ${llmSeg.lang || "—"})`;
    wrap.appendChild(flag);
  }

  return wrap;
}

function exportBundle() {
  const reviewer = getReviewerName();
  if (!reviewer) {
    showToast("Please type your name in the header before exporting.", true);
    document.getElementById("reviewer-name").focus();
    return;
  }

  const exportedManifest = JSON.parse(JSON.stringify(state.manifest));
  exportedManifest.reviewed_by = reviewer;
  exportedManifest.reviewed_at = new Date().toISOString();

  const files = {};
  files["manifest.json"] = textToBytes(JSON.stringify(exportedManifest, null, 2));

  let totalRows = 0;
  for (const s of state.stages) {
    if (s.surfaceId === "__manifest" || !s.surface) continue;
    const lines = [];
    for (const c of s.candidates) {
      const r = s.results[c.id];
      if (!r || !r.decision) continue;
      lines.push(JSON.stringify(s.surface.exportRow(c, r)));
      totalRows++;
    }
    if (lines.length) {
      const arcname = s.stage.candidates.replace("candidates.jsonl", "results.jsonl");
      files[arcname] = textToBytes(lines.join("\n") + "\n");
    }
  }

  if (!totalRows) {
    showToast("No decisions yet — nothing to export.", true);
    return;
  }

  const zipped = fflate.zipSync(files, { level: 6 });
  const blob = new Blob([zipped], { type: "application/zip" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `gold-review-results-${date}.zip`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`Exported ${totalRows} decision${totalRows === 1 ? "" : "s"} across ${state.stages.length - 1} stage(s).`);
}

let toastTimer = null;
function showToast(msg, isError) {
  const existing = document.querySelector(".toast");
  if (existing) existing.remove();
  if (toastTimer) clearTimeout(toastTimer);
  const t = document.createElement("div");
  t.className = "toast" + (isError ? " error" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  toastTimer = setTimeout(() => {
    t.classList.add("fade");
    setTimeout(() => t.remove(), 300);
  }, 3500);
}

// =====================================================================
// Auto-fetch sibling bundle.zip when served over HTTP
// =====================================================================
//
// When the HTML is served by Caddy at
// http://localhost:8080/files/<run_uuid>/cataloguer-review/cataloguer-review.html
// the bundle sits next to it at ./bundle.zip. Fetch it on load so the
// cataloguer doesn't need to drag-drop. Falls back to the dropzone UX
// when running under file:// (double-click) or when the fetch fails.

async function autoFetchBundle(opts) {
  const explicit = !!(opts && opts.explicit);
  if (!explicit && !location.protocol.startsWith("http")) return;
  try {
    const resp = await fetch("./bundle.zip", { cache: "no-cache" });
    if (!resp.ok) {
      if (explicit) showToast(`Reload failed (HTTP ${resp.status}).`, true);
      return;
    }
    const buf = await resp.arrayBuffer();
    const file = new File([buf], "bundle.zip", { type: "application/zip" });
    await handleFile(file);
    document.getElementById("btn-reload").hidden = false;
  } catch (e) {
    // Network failure (typical for file:// or unreachable host) — leave
    // the dropzone visible. Only toast if the user explicitly clicked
    // Reload; auto-load failures are silent so file:// double-clicks
    // don't surface a scary error.
    if (explicit) showToast("Reload failed: " + e.message, true);
  }
}

});

document.addEventListener("keydown", e => {
  const active = state.stages[state.activeStageIdx];
  if (!active || !active.surface || !active.candidates.length) return;
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const c = active.candidates[active.currentIdx];
  if (!c) return;
  if (e.key === "ArrowLeft" && active.currentIdx > 0) {
    active.currentIdx--; persistState(); render();
    return;
  }
  if (e.key === "ArrowRight" && active.currentIdx < active.candidates.length - 1) {
    active.currentIdx++; persistState(); render();
    return;
  }
  // Per-surface decision shortcuts.
  const key = e.key.toLowerCase();
  const dec = getDecisionConfig(active.surface).find(d => d.key === key);
  if (dec) {
    const r = ensureResult(active, c);
    r.decision = dec.id;
    if (typeof dec.onChoose === "function") dec.onChoose(r);
    stampReview(r); persistState(); render(); autoAdvance(active);
  }
});

</script>
</body>
