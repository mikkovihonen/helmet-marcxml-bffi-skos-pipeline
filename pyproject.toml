[project]
name = "bffi-pipeline"
version = "0.1.0"
description = "MARCXML ↔ BIBFRAME ↔ BFFI conversion pipeline (pro bono for the National Library of Finland)."
license = "Apache-2.0"
authors = [{ name = "Mikko Vihonen" }]
requires-python = ">=3.14"
readme = "README.md"

dependencies = [
    "typer>=0.25",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2",
    "rdflib>=7.6",
    "pymarc>=5.3",
    "lxml>=6",
    "pyshacl>=0.31",
    "python-ulid>=3",
    "jinja2>=3.1",
    "httpx>=0.28",
    "requests>=2.33",
    # Local-only Prometheus exporter for the `bffi-pipeline serve-metrics`
    # subcommand. Pulled in only when the operator runs serve-metrics;
    # pipeline stages never import it. Outbound-telemetry-free — the
    # exporter exposes a local /metrics endpoint that the operator's own
    # Prometheus container scrapes. See docs/observability.md.
    "prometheus-client>=0.25",
    # marcxml_export_pipeline.sierra — Sierra Postgres replica → MARCXML export.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1",
    "ruff>=0.15",
    "mypy>=2",
    "types-requests",
    "lxml-stubs",
]

[project.scripts]
bffi-pipeline = "bffi_pipeline.cli:app"
marcxml-export-sierra = "marcxml_export_pipeline.sierra.marcxml:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bffi_pipeline", "src/marcxml_export_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
# SQLAlchemy + dotenv are deferred to function bodies in the Sierra exporter
# so the CLI entry point starts quickly when not actually streaming from the
# DB, and so the module imports cleanly without optional dotenv installed.
"src/marcxml_export_pipeline/sierra/marcxml.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "pyshacl",
    "pyshacl.*",
    "pymarc",
    "pymarc.*",
]
ignore_missing_imports = true

# pymarc 5.x ships py.typed but several methods (Record.add_field,
# marcxml.record_to_xml, …) are unannotated. Silence the cascading
# "Call to untyped function" errors on the one module that uses these
# calls heavily; the rest of the Sierra-export logic stays under
# --strict so dataclass / DTO contracts are fully type-checked.
[[tool.mypy.overrides]]
module = ["marcxml_export_pipeline.sierra.marcxml"]
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "integration: tests that require Docker services (Fuseki/Grafana)",
]
